<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>탐어 & 생물 관찰 도감</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 카카오 지도 API -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=9ebb99350df488c6fa21d77640db6f29&autoload=false&libraries=services"></script>
</head>
<body>
  <header>
    <h1>🌿 마이 네이처링 : 생물 채집 & 관찰 일지</h1>
    <p>실시간으로 함께 기록하고 지도로 보는 민물 생물 도감</p>
  </header>

  <main>
    <!-- 카카오 지도 영역 -->
    <section class="map-section">
      <h2>🗺️ 생물 관찰 지도</h2>
      <p class="map-sub">지도의 핀을 누르면 관찰 기록을 볼 수 있으며, 등록 시 지도를 클릭해 위치를 지정할 수 있습니다.</p>
      <div id="map" style="width:100%; height:360px; border-radius:10px; background:#e9ecef;"></div>
    </section>

    <!-- 생물 관찰 기록 입력 폼 -->
    <section class="form-section">
      <h2 id="form-title">📷 새 생물 관찰 기록하기</h2>
      <form id="observation-form">
        <!-- 수정용 ID 저장 숨김 필드 -->
        <input type="hidden" id="edit-id" value="">

        <div class="form-group">
          <label for="name">생물 이름</label>
          <input type="text" id="name" placeholder="예: 밀어, 꺽지, 물방개" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="category">분류</label>
            <select id="category">
              <option value="fish">민물고기</option>
              <option value="insect">곤충</option>
              <option value="other">기타 생물</option>
            </select>
          </div>
          <div class="form-group">
            <label for="type">특성/세부분류</label>
            <input type="text" id="type" placeholder="예: 저서어, 수생곤충, 계류성">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="date">채집/관찰 일자</label>
            <input type="date" id="date" required>
          </div>
          <div class="form-group">
            <label for="location">채집 장소 이름</label>
            <input type="text" id="location" placeholder="예: 춘천 공지천, 가평 조종천 등">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="lat">선택된 위도 (Latitude)</label>
            <input type="text" id="lat" placeholder="지도를 클릭하세요" readonly>
          </div>
          <div class="form-group">
            <label for="lng">선택된 경도 (Longitude)</label>
            <input type="text" id="lng" placeholder="지도를 클릭하세요" readonly>
          </div>
        </div>

        <div class="form-group">
          <label for="image-file">사진 첨부 (새 사진 선택 시에만 변경됨)</label>
          <input type="file" id="image-file" accept="image/*">
        </div>

        <div class="form-group">
          <label for="desc">관찰 및 사육 메모</label>
          <textarea id="desc" rows="3" placeholder="서식지 환경, 바닥재, 먹이 반응, 관찰 특징 등"></textarea>
        </div>

        <button type="submit" id="submit-btn" class="submit-btn">관찰 일지 서버에 등록하기</button>
        <button type="button" id="cancel-btn" class="cancel-btn" onclick="resetForm()" style="display:none;">수정 취소</button>
      </form>
    </section>

    <!-- 카테고리 필터 버튼 -->
    <div class="category-buttons">
      <button type="button" onclick="filterCategory('all')">전체 보기</button>
      <button type="button" onclick="filterCategory('fish')">민물고기</button>
      <button type="button" onclick="filterCategory('insect')">곤충</button>
      <button type="button" onclick="filterCategory('other')">기타</button>
    </div>

    <!-- 생물 카드 출력 영역 -->
    <div id="card-container" class="grid-container"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
